<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">音乐制作工作流拆解</title>
  <desc id="desc">从参考与流派分析到母带交付的八个阶段，包含角色分工、检查点和回退路径。</desc>
  <rect width="1200" height="780" fill="#F6F1E7"/>
  <rect x="24" y="24" width="1152" height="732" fill="none" stroke="#D8CDBD"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="48" y="74" font-size="28" font-weight="700" fill="#1C1B19">音乐制作：把“感觉”翻译成可执行约束</text>
    <text x="48" y="101" font-size="13" fill="#5E5A52">先对齐流派骨架，再谈音色与参数；否则越精确，越像一份 mockup。</text>
    <text x="1152" y="74" text-anchor="end" font-family="'JetBrains Mono','Consolas',monospace" font-size="11" fill="#3E5C6B">PLATE 02 / MUSIC WORKFLOW</text>
    <text x="1152" y="101" text-anchor="end" font-family="'JetBrains Mono','Consolas',monospace" font-size="11" fill="#8A8175">RITTEN POEMS · 2026.10</text>

    <!-- timeline -->
    <line x1="76" y1="150" x2="76" y2="640" stroke="#C9B99E" stroke-width="1.4"/>
    <g font-family="'JetBrains Mono','Consolas',monospace" font-size="10" fill="#B23A2B">
      <text x="76" y="146" text-anchor="middle">01</text>
      <text x="76" y="210" text-anchor="middle">02</text>
      <text x="76" y="274" text-anchor="middle">03</text>
      <text x="76" y="338" text-anchor="middle">04</text>
      <text x="76" y="402" text-anchor="middle">05</text>
      <text x="76" y="466" text-anchor="middle">06</text>
      <text x="76" y="530" text-anchor="middle">07</text>
      <text x="76" y="594" text-anchor="middle">08</text>
    </g>

    <!-- rows -->
    <g>
      <!-- 1 -->
      <rect x="120" y="122" width="720" height="52" fill="#FBF7EF" stroke="#2A2824" stroke-width="1.2"/>
      <rect x="120" y="122" width="6" height="52" fill="#6F7F6A"/>
      <text x="142" y="145" font-size="15" font-weight="700" fill="#1C1B19">参考与流派分析</text>
      <text x="142" y="163" font-size="11" fill="#5E5A52">参考曲 / 视频 / 社区讨论 → 结构、音色、节奏、响度画像</text>
      <rect x="742" y="137" width="60" height="20" fill="#E8EDE4" stroke="#6F7F6A" stroke-width="0.8"/>
      <text x="772" y="151" text-anchor="middle" font-size="10" fill="#4E5D49">AI + 人</text>
      <text x="862" y="144" font-family="'JetBrains Mono','Consolas',monospace" font-size="10" fill="#8A8175">OUTPUT</text>
      <text x="862" y="161" font-size="11" fill="#1C1B19">流派画像 / 参考清单</text>
      <path d="M76 174 L76 174" stroke="#C49A4A"/>

      <!-- 2 -->
      <rect x="120" y="186" width="720" height="52" fill="#FBF7EF" stroke="#2A2824" stroke-width="1.2"/>
      <rect x="120" y="186" width="6" height="52" fill="#B23A2B"/>
      <text x="142" y="209" font-size="15" font-weight="700" fill="#1C1B19">约束定义</text>
      <text x="142" y="227" font-size="11" fill="#5E5A52">平台 / 时长 / 受众 → BPM、调性、小节数、响度目标</text>
      <rect x="742" y="201" width="48" height="20" fill="#F3E2DE" stroke="#B23A2B" stroke-width="0.8"/>
      <text x="766" y="215" text-anchor="middle" font-size="10" fill="#8E2E22">人主导</text>
      <text x="862" y="208" font-family="'JetBrains Mono','Consolas',monospace" font-size="10" fill="#8A8175">OUTPUT</text>
      <text x="862" y="225" font-size="11" fill="#1C1B19">可执行的制作约束</text>

      <!-- 3 -->
      <rect x="120" y="250" width="720" height="52" fill="#FBF7EF" stroke="#2A2824" stroke-width="1.2"/>
      <rect x="120" y="250" width="6" height="52" fill="#6F7F6A"/>
      <text x="142" y="273" font-size="15" font-weight="700" fill="#1C1B19">作曲 / 动机</text>
      <text x="142" y="291" font-size="11" fill="#5E5A52">主题 / 情绪 / 歌词 → 动机、和声进行、旋律轮廓</text>
      <rect x="742" y="265" width="60" height="20" fill="#E8EDE4" stroke="#6F7F6A" stroke-width="0.8"/>
      <text x="772" y="279" text-anchor="middle" font-size="10" fill="#4E5D49">AI + 人</text>
      <text x="862" y="272" font-family="'JetBrains Mono','Consolas',monospace" font-size="10" fill="#8A8175">OUTPUT</text>
      <text x="862" y="289" font-size="11" fill="#1C1B19">主题可辨识的谱面</text>

      <!-- 4 -->
      <rect x="120" y="314" width="720" height="52" fill="#FBF7EF" stroke="#2A2824" stroke-width="1.2"/>
      <rect x="120" y="314" width="6" height="52" fill="#3E5C6B"/>
      <text x="142" y="337" font-size="15" font-weight="700" fill="#1C1B19">编曲 / 配器</text>
      <text x="142" y="355" font-size="11" fill="#5E5A52">结构 / 乐器 → 段落、进入与退出、密度、能量弧线</text>
      <rect x="742" y="329" width="38" height="20" fill="#E2EBEF" stroke="#3E5C6B" stroke-width="0.8"/>
      <text x="761" y="343" text-anchor="middle" font-size="10" fill="#2E4A58">AI</text>
      <text x="862" y="336" font-family="'JetBrains Mono','Consolas',monospace" font-size="10" fill="#8A8175">OUTPUT</text>
      <text x="862" y="353" font-size="11" fill="#1C1B19">分轨 / MIDI / 编排表</text>

      <!-- 5 -->
      <rect x="120" y="378" width="720" height="52" fill="#FBF7EF" stroke="#2A2824" stroke-width="1.2"/>
      <rect x="120" y="378" width="6" height="52" fill="#3E5C6B"/>
      <text x="142" y="401" font-size="15" font-weight="700" fill="#1C1B19">音色 / 采样</text>
      <text x="142" y="419" font-size="11" fill="#5E5A52">音源 / 演奏法 → 分层、力度、round robin、人性化处理</text>
      <rect x="742" y="393" width="38" height="20" fill="#E2EBEF" stroke="#3E5C6B" stroke-width="0.8"/>
      <text x="761" y="407" text-anchor="middle" font-size="10" fill="#2E4A58">AI</text>
      <text x="862" y="400" font-family="'JetBrains Mono','Consolas',monospace" font-size="10" fill="#8A8175">OUTPUT</text>
      <text x="862" y="417" font-size="11" fill="#1C1B19">可混音的音色层</text>

      <!-- 6 -->
      <rect x="120" y="442" width="720" height="52" fill="#FBF7EF" stroke="#2A2824" stroke-width="1.2"/>
      <rect x="120" y="442" width="6" height="52" fill="#6F7F6A"/>
      <text x="142" y="465" font-size="15" font-weight="700" fill="#1C1B19">人声 / 演唱</text>
      <text x="142" y="483" font-size="11" fill="#5E5A52">歌词 / 旋律 / 声线 → 咬字、音素、情绪、独立叠唱</text>
      <rect x="742" y="457" width="60" height="20" fill="#E8EDE4" stroke="#6F7F6A" stroke-width="0.8"/>
      <text x="772" y="471" text-anchor="middle" font-size="10" fill="#4E5D49">AI + 人</text>
      <text x="862" y="464" font-family="'JetBrains Mono','Consolas',monospace" font-size="10" fill="#8A8175">OUTPUT</text>
      <text x="862" y="481" font-size="11" fill="#1C1B19">可听清的演唱分轨</text>

      <!-- 7 -->
      <rect x="120" y="506" width="720" height="52" fill="#FBF7EF" stroke="#2A2824" stroke-width="1.2"/>
      <rect x="120" y="506" width="6" height="52" fill="#3E5C6B"/>
      <text x="142" y="529" font-size="15" font-weight="700" fill="#1C1B19">混音</text>
      <text x="142" y="547" font-size="11" fill="#5E5A52">分轨 → 平衡、空间、动态、频段关系、段落对照</text>
      <rect x="742" y="521" width="38" height="20" fill="#E2EBEF" stroke="#3E5C6B" stroke-width="0.8"/>
      <text x="761" y="535" text-anchor="middle" font-size="10" fill="#2E4A58">AI</text>
      <text x="862" y="528" font-family="'JetBrains Mono','Consolas',monospace" font-size="10" fill="#8A8175">OUTPUT</text>
      <text x="862" y="545" font-size="11" fill="#1C1B19">混音母版 / 对照报告</text>

      <!-- 8 -->
      <rect x="120" y="570" width="720" height="52" fill="#FBF7EF" stroke="#2A2824" stroke-width="1.2"/>
      <rect x="120" y="570" width="6" height="52" fill="#B23A2B"/>
      <text x="142" y="593" font-size="15" font-weight="700" fill="#1C1B19">母带 / 交付</text>
      <text x="142" y="611" font-size="11" fill="#5E5A52">混音 → LUFS、真峰、平台版本、封面 / 元数据</text>
      <rect x="742" y="585" width="60" height="20" fill="#E8EDE4" stroke="#6F7F6A" stroke-width="0.8"/>
      <text x="772" y="599" text-anchor="middle" font-size="10" fill="#4E5D49">AI + 人</text>
      <text x="862" y="592" font-family="'JetBrains Mono','Consolas',monospace" font-size="10" fill="#8A8175">OUTPUT</text>
      <text x="862" y="609" font-size="11" fill="#1C1B19">可发布文件 + 分析数据</text>
    </g>

    <!-- gates on timeline -->
    <g fill="#C49A4A">
      <path d="M76,200 l8,8 l-8,8 l-8,-8 z"/>
      <path d="M76,264 l8,8 l-8,8 l-8,-8 z"/>
      <path d="M76,328 l8,8 l-8,8 l-8,-8 z"/>
      <path d="M76,456 l8,8 l-8,8 l-8,-8 z"/>
      <path d="M76,584 l8,8 l-8,8 l-8,-8 z"/>
    </g>

    <!-- loop back -->
    <path d="M840 596 L840 640 L486 640 L486 366" fill="none" stroke="#B23A2B" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrowRed)"/>
    <rect x="512" y="626" width="306" height="28" fill="#F6F1E7"/>
    <text x="665" y="645" text-anchor="middle" font-size="11" fill="#8E2E22">整体听感不对：回退编曲与流派骨架，不是继续压响度</text>

    <!-- bottom evidence strip -->
    <line x1="48" y1="684" x2="1152" y2="684" stroke="#D8CDBD"/>
    <text x="48" y="710" font-family="'JetBrains Mono','Consolas',monospace" font-size="10" fill="#3E5C6B">MEASURED DELIVERY</text>
    <text x="48" y="730" font-size="11" fill="#1C1B19">案例《Pride &amp; Envy（抖音 cut）》：15.36 s · 140.625 BPM · C 小调 · 9 小节 · −9.18 LUFS · 真峰 −1.13 dBTP · LRA 1.5</text>
    <text x="48" y="750" font-size="11" fill="#8A8175">这些数字证明“可复现、可检查”，不证明“好听”。好听仍然要由人完成最终验收。</text>
  </g>
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B23A2B"/>
    </marker>
  </defs>
</svg>
