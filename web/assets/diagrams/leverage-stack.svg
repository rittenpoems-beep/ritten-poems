<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">杠杆来自流程结构，而不是更大的模型</title>
  <desc id="desc">五层工作流结构：定义、拆解、选路、执行、验收；标注人类与 AI 的分工，并用杠杆等式说明人的判断、AI 的执行与流程结构如何相乘。</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1C1B19"/>
    </marker>
  </defs>
  <rect width="1200" height="740" fill="#F6F1E7"/>
  <rect x="24" y="24" width="1152" height="692" fill="none" stroke="#D8CDBD"/>

  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="48" y="74" font-size="28" font-weight="700" fill="#1C1B19">杠杆不在模型里，在流程结构里</text>
    <text x="48" y="101" font-size="13" fill="#5E5A52">AI 放大的是执行。流程决定这些执行能否被组织、比较、验收和复用。</text>
    <text x="1152" y="74" text-anchor="end" font-family="'JetBrains Mono','Consolas',monospace" font-size="11" fill="#3E5C6B">PLATE 04 / LEVERAGE STACK</text>
    <text x="1152" y="101" text-anchor="end" font-family="'JetBrains Mono','Consolas',monospace" font-size="11" fill="#8A8175">RITTEN POEMS · 2026.10</text>

    <!-- layers -->
    <g>
      <!-- 01 define -->
      <rect x="48" y="150" width="760" height="68" fill="#FBF7EF" stroke="#2A2824" stroke-width="1.3"/>
      <rect x="48" y="150" width="5" height="68" fill="#B23A2B"/>
      <text x="70" y="178" font-family="'JetBrains Mono','Consolas',monospace" font-size="11" fill="#B23A2B">01</text>
      <text x="102" y="180" font-size="17" font-weight="700" fill="#1C1B19">定义</text>
      <text x="160" y="180" font-size="11" fill="#8A8175">DEFINE</text>
      <text x="102" y="201" font-size="11.5" fill="#5E5A52">交付物是什么 · 约束是什么 · 什么才算完成</text>
      <rect x="682" y="171" width="104" height="24" fill="#F3E2DE" stroke="#B23A2B" stroke-width="0.8"/>
      <text x="734" y="187" text-anchor="middle" font-size="10.5" fill="#8E2E22">人主导</text>

      <path d="M110 218 V230" stroke="#1C1B19" marker-end="url(#arrow-dark)"/>

      <!-- 02 decompose -->
      <rect x="48" y="230" width="760" height="68" fill="#FBF7EF" stroke="#2A2824" stroke-width="1.3"/>
      <rect x="48" y="230" width="5" height="68" fill="#6F7F6A"/>
      <text x="70" y="258" font-family="'JetBrains Mono','Consolas',monospace" font-size="11" fill="#6F7F6A">02</text>
      <text x="102" y="260" font-size="17" font-weight="700" fill="#1C1B19">拆解</text>
      <text x="160" y="260" font-size="11" fill="#8A8175">DECOMPOSE</text>
      <text x="102" y="281" font-size="11.5" fill="#5E5A52">阶段 · 依赖 · 优先级 · 哪些部分可以并行</text>
      <rect x="682" y="251" width="104" height="24" fill="#E8EDE4" stroke="#6F7F6A" stroke-width="0.8"/>
      <text x="734" y="267" text-anchor="middle" font-size="10.5" fill="#4E5D49">人 + AI</text>

      <path d="M110 298 V310" stroke="#1C1B19" marker-end="url(#arrow-dark)"/>

      <!-- 03 route -->
      <rect x="48" y="310" width="760" height="68" fill="#FBF7EF" stroke="#2A2824" stroke-width="1.3"/>
      <rect x="48" y="310" width="5" height="68" fill="#6F7F6A"/>
      <text x="70" y="338" font-family="'JetBrains Mono','Consolas',monospace" font-size="11" fill="#6F7F6A">03</text>
      <text x="102" y="340" font-size="17" font-weight="700" fill="#1C1B19">选路</text>
      <text x="160" y="340" font-size="11" fill="#8A8175">ROUTE</text>
      <text x="102" y="361" font-size="11.5" fill="#5E5A52">工具 · 技术 · 成本 · 风险 · 交付形态是否匹配</text>
      <rect x="682" y="331" width="104" height="24" fill="#E8EDE4" stroke="#6F7F6A" stroke-width="0.8"/>
      <text x="734" y="347" text-anchor="middle" font-size="10.5" fill="#4E5D49">人 + AI</text>

      <path d="M110 378 V390" stroke="#1C1B19" marker-end="url(#arrow-dark)"/>

      <!-- 04 execute -->
      <rect x="48" y="390" width="760" height="68" fill="#EEF3F5" stroke="#2A2824" stroke-width="1.3"/>
      <rect x="48" y="390" width="5" height="68" fill="#3E5C6B"/>
      <text x="70" y="418" font-family="'JetBrains Mono','Consolas',monospace" font-size="11" fill="#3E5C6B">04</text>
      <text x="102" y="420" font-size="17" font-weight="700" fill="#1C1B19">执行</text>
      <text x="160" y="420" font-size="11" fill="#8A8175">EXECUTE</text>
      <text x="102" y="441" font-size="11.5" fill="#5E5A52">建模 · 材质 · 灯光 · 混音 · 编码 · 渲染 · 剪辑</text>
      <rect x="682" y="411" width="104" height="24" fill="#E2EBEF" stroke="#3E5C6B" stroke-width="0.8"/>
      <text x="734" y="427" text-anchor="middle" font-size="10.5" fill="#2E4A58">AI 主导</text>

      <path d="M110 458 V470" stroke="#1C1B19" marker-end="url(#arrow-dark)"/>

      <!-- 05 accept -->
      <rect x="48" y="470" width="760" height="68" fill="#FBF7EF" stroke="#2A2824" stroke-width="1.3"/>
      <rect x="48" y="470" width="5" height="68" fill="#B23A2B"/>
      <text x="70" y="498" font-family="'JetBrains Mono','Consolas',monospace" font-size="11" fill="#B23A2B">05</text>
      <text x="102" y="500" font-size="17" font-weight="700" fill="#1C1B19">验收</text>
      <text x="160" y="500" font-size="11" fill="#8A8175">ACCEPT</text>
      <text x="102" y="521" font-size="11.5" fill="#5E5A52">对照 · 试听 · 测试 · 回归 · 交付清单 · 人真的点头</text>
      <rect x="682" y="491" width="104" height="24" fill="#F3E2DE" stroke="#B23A2B" stroke-width="0.8"/>
      <text x="734" y="507" text-anchor="middle" font-size="10.5" fill="#8E2E22">人主导</text>
    </g>

    <text x="48" y="560" font-size="11" fill="#8A8175">越往下，AI 越能承担执行；越往上，越需要人来定义与判断。验收不合格时，回到对应阶段，而不是回到提示词。</text>

    <!-- right panel A -->
    <rect x="832" y="150" width="320" height="190" fill="#FBF7EF" stroke="#2A2824" stroke-width="1.3"/>
    <text x="852" y="176" font-size="14" font-weight="700" fill="#1C1B19">同样的模型，不同的组织方式</text>
    <text x="852" y="196" font-size="10.5" fill="#5E5A52">差别不在生成速度，在有效推进的速度。</text>

    <text x="852" y="228" font-size="11" fill="#3F3B35">只改提示词</text>
    <rect x="948" y="217" width="80" height="14" fill="#C9BFae"/>
    <text x="852" y="248" font-size="10" fill="#8A8175">在同一处反复试错，结果不可复用</text>

    <text x="852" y="280" font-size="11" font-weight="700" fill="#8E2E22">拆解 + 验收</text>
    <rect x="948" y="269" width="182" height="14" fill="#B23A2B"/>
    <text x="852" y="300" font-size="10" fill="#5E5A52">阶段并行推进，每一步都有检查与交接</text>

    <text x="852" y="324" font-size="11" fill="#4E5D49">相同的模型，被组织成了两种完全不同的产能。</text>

    <!-- right panel B -->
    <rect x="832" y="356" width="320" height="182" fill="#FBF7EF" stroke="#2A2824" stroke-width="1.3"/>
    <text x="852" y="382" font-size="14" font-weight="700" fill="#1C1B19">不能被外包的三件事</text>
    <text x="852" y="402" font-size="10.5" fill="#5E5A52">可以交给 AI 执行，但不能交给 AI 代替你负责。</text>

    <text x="852" y="430" font-family="'JetBrains Mono','Consolas',monospace" font-size="10" fill="#B23A2B">01</text>
    <text x="876" y="430" font-size="12" font-weight="700" fill="#1C1B19">定义：什么值得被完成</text>
    <text x="852" y="452" font-family="'JetBrains Mono','Consolas',monospace" font-size="10" fill="#B23A2B">02</text>
    <text x="876" y="452" font-size="12" font-weight="700" fill="#1C1B19">选路：为什么是这条路</text>
    <text x="852" y="474" font-family="'JetBrains Mono','Consolas',monospace" font-size="10" fill="#B23A2B">03</text>
    <text x="876" y="474" font-size="12" font-weight="700" fill="#1C1B19">验收：什么才算合格</text>
    <text x="852" y="506" font-size="10.5" fill="#5E5A52">AI 可以给你建议、证据和方案，</text>
    <text x="852" y="522" font-size="10.5" fill="#5E5A52">但这三件事的后果仍然由你承担。</text>

    <!-- equation -->
    <rect x="48" y="566" width="1104" height="104" fill="#FBF7EF" stroke="#2A2824" stroke-width="1.3"/>
    <text x="72" y="588" font-family="'JetBrains Mono','Consolas',monospace" font-size="10" fill="#8A8175">LEVERAGE EQUATION</text>
    <text x="1128" y="588" text-anchor="end" font-size="10.5" fill="#8A8175">任何一项为零，乘积为零。</text>

    <rect x="72" y="600" width="170" height="44" fill="#F3E2DE" stroke="#B23A2B" stroke-width="0.9"/>
    <text x="157" y="627" text-anchor="middle" font-size="14" font-weight="700" fill="#8E2E22">人的判断</text>
    <text x="258" y="628" text-anchor="middle" font-size="18" fill="#8A8175">×</text>
    <rect x="282" y="600" width="170" height="44" fill="#E2EBEF" stroke="#3E5C6B" stroke-width="0.9"/>
    <text x="367" y="627" text-anchor="middle" font-size="14" font-weight="700" fill="#2E4A58">AI 的执行</text>
    <text x="468" y="628" text-anchor="middle" font-size="18" fill="#8A8175">×</text>
    <rect x="492" y="600" width="170" height="44" fill="#E8EDE4" stroke="#6F7F6A" stroke-width="0.9"/>
    <text x="577" y="627" text-anchor="middle" font-size="14" font-weight="700" fill="#4E5D49">流程的结构</text>
    <text x="678" y="628" text-anchor="middle" font-size="18" fill="#8A8175">=</text>
    <rect x="702" y="600" width="360" height="44" fill="#F6EFDD" stroke="#C49A4A" stroke-width="1"/>
    <text x="882" y="627" text-anchor="middle" font-size="14" font-weight="700" fill="#7A5A1E">一个人可触及的交付半径</text>

    <text x="72" y="660" font-size="10" fill="#8A8175">定义方向 · 选择路线 · 判断价值</text>
    <text x="282" y="660" font-size="10" fill="#8A8175">建模 / 混音 / 编码 / 渲染 / 剪辑</text>
    <text x="492" y="660" font-size="10" fill="#8A8175">拆阶段 / 定依赖 / 设闸门 / 留证据</text>

    <text x="48" y="712" font-size="12" fill="#5E5A52">你不需要会拧每一颗螺丝，但要知道什么时候该换一把螺丝刀。</text>
    <text x="1152" y="712" text-anchor="end" font-family="'JetBrains Mono','Consolas',monospace" font-size="10" fill="#8A8175">WORKFLOW DECOMPOSITION / 04</text>
  </g>
</svg>
